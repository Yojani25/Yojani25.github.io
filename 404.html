<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOMINO 96</title>
<meta name="description" content="Dominó cubano en parejas y a uno: doble 9, 96 fichas... o el doble 6 de siempre. Juega con amigos por código.">
<meta name="robots" content="index,follow">
<style>
:root{--felt:#0C3666;--deep:#071F3D;--stitch:rgba(243,199,74,.42);--cream:#F6EFDC;--gold:#f3c74a}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#0C3E76 0%,#07284E 60%,#04182F 100%);color:#c3d3e6;font-family:-apple-system,Segoe UI,Arial,sans-serif;line-height:1.5}
main{width:min(92vw,380px);padding:24px 22px 20px;border-radius:22px;background:var(--felt);border:2px solid var(--deep);outline:1.5px dashed var(--stitch);outline-offset:-7px;box-shadow:inset 0 2px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.5);text-align:center}
h1{margin:0;font-size:34px;letter-spacing:.06em;color:#f0e2b8;text-shadow:0 3px 0 #b98a24}
.sub{margin:2px 0 18px;font-size:13px;color:#93AECF}
#invite{display:none;margin:0 0 16px}
#invite p{margin:0 0 6px;font-size:14px;color:var(--cream)}
#code{display:inline-block;padding:10px 22px;border-radius:14px;background:var(--deep);box-shadow:inset 0 2px 6px rgba(0,0,0,.55);font-size:34px;letter-spacing:.35em;color:var(--gold);font-weight:800;text-indent:.35em}
#how{margin:10px 0 0;font-size:12.5px;color:#93AECF}
a.btn{display:block;margin:6px 0 0;padding:14px 0;border-radius:999px;background:linear-gradient(180deg,#f6d787,#d9a83c);border:2px solid #ffe9a8;color:#3a2708;font-weight:800;letter-spacing:.04em;text-decoration:none;font-size:15px}
a.ghost{display:block;margin:10px 0 0;padding:10px 0;border-radius:999px;background:rgba(0,0,0,.28);color:#A9C2E3;text-decoration:none;font-size:13px;box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
footer{margin-top:18px;font-size:11.5px;color:#8FA9CC}footer a{color:#ffd873}
</style></head><body><main>
<h1>DOMINO 96</h1>
<p class="sub">Dominó cubano. Doble 9, 96 fichas. Doble 6 cuando quieras.</p>
<div id="invite">
  <p>Te invitaron a una sala:</p>
  <div id="code" aria-live="polite"></div>
  <p id="how">Abre DOMINO 96 → <b>Sala privada</b> → escribe el código.</p>
</div>
<a class="btn" id="store" href="https://apps.apple.com/app/id6808400753">Descargar en el App Store</a>
<a class="ghost" href="legal/">Términos, Privacidad y Créditos</a>
<footer>Yojani Hernandez Rodriguez · <a href="mailto:yojani011225@gmail.com">yojani011225@gmail.com</a></footer>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var raw=(q.get("sala")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
  if(raw.length!==4)return;
  document.getElementById("code").textContent=raw;
  document.getElementById("invite").style.display="block";
  var how=document.getElementById("how");
  if(q.get("modo")==="uno")how.textContent+=" Modo: a uno.";
  if(q.get("juego")==="d6")how.textContent+=" Juego: doble 6.";
})();
</script>
</body></html>
